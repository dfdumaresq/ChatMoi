<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ollama Chat</title>
    
    <!-- Load Highlight.js first -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" />
    <!-- <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script> -->
     <script src="js/highlight.min.js"></script>
    
    <!-- Load Marked.js after Highlight.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link rel="stylesheet" href="css/styles.css">
    <!-- Include our modular JS using type="module" -->
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <h1>Ollama Chat</h1>
    
    <div>
      <label for="server-url">Ollama Server URL:</label>
      <input type="text" id="server-url" value="http://19.19.0.25:8080" placeholder="http://localhost:8080">
    </div>

    <div style="margin-bottom: 1rem;">
        <label for="model-select"><strong>Model:</strong></label>
        <select id="model-select"></select>
        <div style="margin-bottom: 1rem;">
            <label for="preset-select"><strong>Personality:</strong></label>
            <select id="preset-select">
              <option value="scholar">Spiritual Scholar</option>
              <option value="safety">AI Safety Expert</option>
              <option value="philosopher">Playful Philosopher</option>
              <option value="neutral" selected>Neutral Assistant</option>
            </select>
          </div>
    </div>    
    
    <textarea id="prompt" placeholder="Ask something..."></textarea><br />

    <button id="ask-button">Ask</button>
    <button id="abort-button">Abort</button>
    <div id="history"></div>
  </body>
</html>
